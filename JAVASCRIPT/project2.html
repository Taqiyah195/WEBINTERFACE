<!DOCTYPE html>
<html>
<head>
    <title>Student Identity Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d8b4fe, #fbcfe8, #bfdbfe);
        }

        .container {
            width: 380px;
            padding: 30px;
            background-color: white;
            border-radius: 25px;
            box-shadow: 0 15px 35px gray;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: purple;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
        }

        h1 {
            color: #4c1d95;
            margin-bottom: 5px;
        }

        .subtitle {
            color: gray;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 2px solid #e9d5ff;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: purple;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background-color: purple;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6a0dad;
        }

        .card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #faf5ff;
            border: 2px solid #e9d5ff;
            border-radius: 18px;
            text-align: left;
        }

        .card h2 {
            text-align: center;
            color: #6b21a8;
            margin-top: 0;
        }

        .info {
            padding: 10px;
            margin: 8px 0;
            background-color: white;
            border-radius: 10px;
        }

        .label {
            color: #6b21a8;
            font-weight: bold;
        }

        .reset-btn {
            background-color: #f3f4f6;
            color: purple;
        }

        .reset-btn:hover {
            background-color: #e9d5ff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎓</div>

    <h1>Student Identity</h1>

    <p class="subtitle">
        Create Your Personal Student Profile
    </p>

    <input 
        type="text" 
        id="name" 
        placeholder="Enter Student Name"
    >

    <input 
        type="text" 
        id="roll" 
        placeholder="Enter Roll Number"
    >

    <input 
        type="text" 
        id="department" 
        placeholder="Enter Department"
    >

    <input 
        type="text" 
        id="year" 
        placeholder="Enter Year"
    >

    <input 
        type="number" 
        id="marks" 
        placeholder="Enter Marks (0-100)"
    >

    <button onclick="displayProfile()">
        Generate My Profile ✨
    </button>

    <div class="card" id="profile">

        <h2>🌟 Student Profile</h2>

        <div class="info">
            <span class="label">👤 Name:</span>
            <span id="sname"></span>
        </div>

        <div class="info">
            <span class="label">🆔 Roll No:</span>
            <span id="sroll"></span>
        </div>

        <div class="info">
            <span class="label">💻 Department:</span>
            <span id="sdepartment"></span>
        </div>

        <div class="info">
            <span class="label">🎓 Year:</span>
            <span id="syear"></span>
        </div>

        <div class="info">
            <span class="label">📚 Marks:</span>
            <span id="smarks"></span>
        </div>

        <button class="reset-btn" onclick="resetProfile()">
            Create New Profile 🔄
        </button>

    </div>

</div>

<script>

function displayProfile()
{
    var name = document.getElementById("name").value;
    var roll = document.getElementById("roll").value;
    var department = document.getElementById("department").value;
    var year = document.getElementById("year").value;
    var marks = document.getElementById("marks").value;

    if(name === "" || roll === "" || department === "" || year === "" || marks === "")
    {
        alert("Please enter all student details!");
        return;
    }

    if(marks < 0 || marks > 100)
    {
        alert("Please enter marks between 0 and 100!");
        return;
    }

    document.getElementById("sname").innerHTML = name;
    document.getElementById("sroll").innerHTML = roll;
    document.getElementById("sdepartment").innerHTML = department;
    document.getElementById("syear").innerHTML = year;
    document.getElementById("smarks").innerHTML = marks;

    document.getElementById("profile").style.display = "block";
}


function resetProfile()
{
    document.getElementById("name").value = "";
    document.getElementById("roll").value = "";
    document.getElementById("department").value = "";
    document.getElementById("year").value = "";
    document.getElementById("marks").value = "";

    document.getElementById("profile").style.display = "none";
}

</script>

</body>
</html>
